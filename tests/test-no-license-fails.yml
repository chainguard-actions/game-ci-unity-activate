name: Test - No license credentials fails gracefully
on:
  workflow_dispatch:
jobs:
  test-no-license-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without any license credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed when no credentials provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no license credentials are provided, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no license credentials were provided"
