name: Test pinned cliVersion input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that a pinned cliVersion is accepted and the action attempts
      # to download that specific release. Activation will fail without
      # real Unity credentials, so we allow the step to fail.
      - id: action
        uses: .
        with:
          cliVersion: 'latest'
          unityVersion: '2022.3.0f1'
        continue-on-error: true

      - name: Assert action ran with pinned cliVersion
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (Unity credentials were available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without Unity credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success or failure)"
            exit 1
          fi
